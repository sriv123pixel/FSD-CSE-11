<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pricing Table</title>
<style>
  .pricing {
    display: flex;
    justify-content: center;
  }
  .plan {
    border: 1px solid #000;
    padding: 10px;
    margin: 5px;
    width: 150px;
    text-align: center;
  }
</style>
</head>
<body>

  <div class="pricing">
    <div class="plan">
      <h3>Basic</h3>
      <p>₹499/month</p>
      <p>1 User</p>
      <p>5GB Storage</p>
    </div>

    <div class="plan">
      <h3>Pro</h3>
      <p>₹999/month</p>
      <p>5 Users</p>
      <p>50GB Storage</p>
    </div>

    <div class="plan">
      <h3>Enterprise</h3>
      <p>₹1999/month</p>
      <p>Unlimited Users</p>
      <p>200GB Storage</p>
    </div>
  </div>

  <div class="plan">


  </div>
</body>
</html>
